.logo{display:flex;align-items:center;gap:10px}
.login .lg-full{align-self:center;color:var(--ink);margin-bottom:6px}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding-top:14px}
.foot .lg-mark{width:26px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--head);color:var(--head-ink)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.logo small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--head-muted);margin-left:8px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1 1 440px}
nav.tabs button{border:0;background:var(--head-pill);color:var(--head-muted);padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--head-ink);color:var(--head)}
.stripe{display:flex;height:5px}
.stripe i{flex:1}

main{max-width:1080px;margin:0 auto;padding-block:18px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 0;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.soft{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--brand-ink)}
.btn.sq{padding:8px 11px}
input[type=text],input[type=password],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 9px;min-width:0;max-width:100%}
input[type=number]{width:120px}
input[type=color]{width:38px;height:36px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand)}

.banner{background:var(--brand-soft);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner b{color:var(--brand)}

.datebar h2{font-size:24px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile strong{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tile.t-ot strong{color:var(--ot)} .tile.t-br strong{color:var(--brand)}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}.tiles .tile:first-child{grid-column:1/-1}.tile strong{font-size:20px}}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:4px;flex:none;display:inline-block}
.sw-ist{width:18px;height:12px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px);border:1px solid var(--line)}
.sw-ot{width:18px;height:12px;border-radius:3px;background:var(--ot-soft);border:1px solid var(--line)}

.bulk{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}

.kartu{display:flex;flex-direction:column;gap:10px}
.kartu.absen{background:var(--surface-2)}
.k-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.k-head h3{font-size:19px}
.k-total{margin-left:auto;text-align:right}
.k-total strong{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ws{background:var(--brand-soft);color:var(--brand)}
.pill.gr{background:var(--ok-soft);color:var(--ok)}
.pill.ev{background:var(--ev-soft);color:var(--ev)}
.pill.ot{background:var(--ot-soft);color:var(--ot)}
.pill.nm{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.off{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.tl{position:relative;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.kartu.absen .tl{background:var(--surface)}
.tl i{position:absolute;top:0;bottom:0;display:block}
.tl .z-ot{background:var(--ot-soft)}
.tl .blk{top:4px;bottom:4px;border-radius:5px}
.tl .blk.err{background:transparent!important;border:2px dashed var(--bad)}
.tl .ist{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 6px),var(--surface-2);z-index:2}
.tl .mark{width:0;border-left:2px dashed var(--ot);z-index:3}
.ticks{position:relative;height:16px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;top:2px;transform:translateX(-50%)}
.ticks span.first{transform:none}.ticks span.last{transform:translateX(-100%)}

.blok{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.blok.err{border-color:var(--bad);background:var(--bad-soft)}
.blok .proj{flex:1 1 140px}
.blok .jam{display:inline-flex;align-items:center;gap:6px}
.blok .hasil{display:flex;flex-wrap:wrap;gap:6px;flex:2 1 220px;min-width:0}
.blok .tarif{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.blok .tarif input{width:104px;padding:6px 8px}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;width:32px;height:32px;border-radius:8px;cursor:pointer;margin-left:auto}
.x:hover{background:var(--bad-soft);color:var(--bad)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
tr.klik{cursor:pointer} tr.klik:hover td{background:var(--surface-2)}
tr.detail td{background:var(--surface-2);font-size:13px}
.detail-list{display:flex;flex-direction:column;gap:4px}
.detail-list div{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.big{font-family:var(--f-display);font-weight:800}

.pbar{display:flex;flex-direction:column;gap:6px}
.pbar .bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.pbar .bar i{display:block;height:100%}
.phead{display:flex;flex-direction:column;gap:6px;width:100%;border:0;background:none;padding:6px;margin:-6px;border-radius:10px;cursor:pointer;text-align:left}
.phead:hover{background:var(--surface-2)}
.phead>span{width:100%}
.pbar.open{border:1px solid var(--line);border-radius:12px;padding:12px}
.pdetail{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.tiles.in{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tiles.in .tile:first-child{grid-column:auto}
.tiles.in .tile{background:var(--surface-2)}
.tiles.in .tile strong{font-size:20px}
.pbar .bar i.l{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 4px,transparent 4px 8px)}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

let S;
const ov=(a,b,c,d)=>Math.max(0,Math.min(b,d)-Math.max(a,c));
function sesi(r){
  let out=[[r.mulai,r.selesai]];
  for(const [x,y] of r.ist){
    out=out.flatMap(([a,b])=>{const res=[];if(x>a)res.push([a,Math.min(b,x)]);if(y<b)res.push([Math.max(a,y),b]);return res.filter(([p,q])=>q>p)});
  }
  return out;
}
function hitung(w,list){
  const r=S.rules[w.tipe],ss=sesi(r),sw=ss.length?1/ss.length:0;
  const rows=[...list].sort((p,q)=>p.a-q.a||p.id-q.id).map(s=>({s,err:'',bobot:0,lem:0,eff:0,bN:0,bL:0}));
  const okd=[];
  if(r.mode==='argo'){
    let n=0;
    for(const x of rows){
      if(n++){x.err='Sudah ada argo lain di hari ini, belum dihitung';continue}
      x.argo=Math.max(1,x.s.hari||1);x.bobot=x.argo;x.eff=x.argo*1440;
      x.tarif=x.s.tarif!=null?x.s.tarif:w.upah;x.bN=x.argo*x.tarif;
    }
  }else for(const x of rows){
    const s=x.s;
    if(s.b<=s.a)x.err='Jam selesai harus setelah jam mulai';
    else if(okd.some(o=>ov(o.a,o.b,s.a,s.b)>0))x.err='Bentrok dengan blok lain, belum dihitung';
    if(x.err)continue;
    okd.push(s);
    const ist=r.ist.reduce((t,[p,q])=>t+ov(s.a,s.b,p,q),0);
    x.eff=s.b-s.a-ist;
    let nm=0;
    for(const [p,q] of ss){const o=ov(s.a,s.b,p,q);nm+=o;x.bobot+=o/(q-p)*sw}
    x.lem=Math.max(0,x.eff-nm);
    x.tarif=s.tarif!=null?s.tarif:w.lembur;
    x.bN=x.bobot*w.upah;
    x.bL=x.lem/60*x.tarif;
  }
  const lem=rows.reduce((t,x)=>t+x.lem,0);
  const hari=rows.reduce((t,x)=>t+x.bobot,0);
  // 2x upah: jam keluar wajib mundur sebanyak jam masuk mundur dari jam normal (masuk 07 -> 23, masuk 08 -> 24)
  const masuk=okd.reduce((m,s)=>Math.min(m,s.a),1e9),keluar=okd.reduce((m,s)=>Math.max(m,s.b),0);
  const syarat=r.dobel&&okd.length?masuk+(r.dobelJam-r.mulai):null;
  const dobel=syarat!=null&&lem>0&&keluar>=syarat;
  if(dobel){
    const pool=r.ganti?Math.max(0,2-hari)*w.upah:w.upah;
    // jam kerja setelah syarat 2x terpenuhi tetap dibayar lembur per jam, di atas 2x upah
    for(const x of rows){
      x.lemA=0;if(x.err||!r.ganti)continue;
      const s=x.s,f=Math.max(s.a,syarat);if(s.b<=f)continue;
      let m=s.b-f;for(const [p,q] of r.ist)m-=ov(f,s.b,p,q);for(const [p,q] of ss)m-=ov(f,s.b,p,q);
      x.lemA=Math.max(0,m);
    }
    const lemB=rows.reduce((t,x)=>t+(x.err?0:x.lem-x.lemA),0);
    for(const x of rows){
      if(x.err)continue;
      if(!r.ganti){x.bL+=pool*x.lem/lem;continue}
      x.bL=(lemB>0?pool*(x.lem-x.lemA)/lemB:pool*x.lem/lem)+x.lemA/60*x.tarif;
    }
  }
  const bN=rows.reduce((t,x)=>t+x.bN,0),bL=rows.reduce((t,x)=>t+x.bL,0);
  return {rows,dobel,syarat,hari,lem,bN,bL,total:bN+bL};
}

const num=(n,d=2)=>(Math.round(n*10**d)/10**d).toLocaleString('id-ID');
const hm=m=>{const x=m>1440?m-1440:m;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')+(m>1440?' (besok)':'')};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};

const tglPendek=s=>new Date(s+'T12:00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});

      {id:3,nama:'Scensored',warna:WARNA[2],aktif:true},{id:4,nama:'Workshop',warna:WARNA[3],aktif:true}],
    rules:{workshop:aturan(480,960,false),garut:aturan(420,1020,true),event:ARGO()},
    segs:[
      g(t,1,1,8,12),g(t,1,2,13,16),g(t,1,3,16,22),
      g(t,2,1,8,12),g(t,2,1,13,16),

      g(y,3,4,8,12),

      g(y,5,3,7,12),g(y,5,3,13,17),
      g(y,6,3,7,12),g(y,6,3,13,17),{id:n++,tgl:y,wid:7,pid:3,a:1080,b:1440,hari:1,tarif:null}],
    kasbon:[{id:400,tgl:y,wid:3,jumlah:100000,ket:'Kasbon'}]};
}

let VER=0,CRED=null,saving=false,dirty=false,saveT=0;
async function rpc(fn,body){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify(body)});

  return r.json();
}
function pakai(d){S=(d&&d.workers)?d:kosong();S.edit=S.edit||{};S.log=S.log||[];S.kasbon=S.kasbon||[];if(!S.rules.event)S.rules.event=ARGO()}

  const r=await rpc('nw28_load',{p_user:u,p_pass:p,p_have:null});

  pakai(r.data);VER=r.version;CRED={u,p};UI.user=u;UI.sync='Tersimpan';
  try{sessionStorage.setItem(KEY+'-cred',JSON.stringify(CRED))}catch(e){}
  return 'ok';
}
function keluar(pesan){
  CRED=null;UI.user='';dirty=false;clearTimeout(saveT);S=kosong();UI.loginErr=pesan||'';
  try{sessionStorage.removeItem(KEY+'-cred')}catch(e){}
  render();
}
function simpan(){dirty=true;setSync('Menyimpan…');clearTimeout(saveT);saveT=setTimeout(kirim,300)}
async function kirim(){
  if(saving||!dirty||!CRED)return;
  saving=true;dirty=false;let jeda=200;
  try{
    const r=await rpc('nw28_save',{p_user:CRED.u,p_pass:CRED.p,p_data:S,p_version:VER});
    if(r.status==='ok'){VER=r.version;if(!dirty)setSync('Tersimpan')}
    else if(r.status==='conflict'){dirty=false;saving=false;await tarik(true);toast('Data baru saja diubah orang lain. Tampilan diperbarui, ulangi perubahan terakhir Anda.');return}
    else{saving=false;keluar(r.status==='locked'?'Terlalu banyak percobaan. Coba lagi nanti.':'Sesi berakhir, silakan masuk lagi.');return}
  }catch(e){dirty=true;jeda=4000;setSync('Gagal menyimpan, mencoba lagi…')}
  saving=false;
  if(dirty){clearTimeout(saveT);saveT=setTimeout(kirim,jeda)}
}
const sedangIsi=()=>{const a=document.activeElement;return !!a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)};
async function tarik(paksa){
  if(!CRED||saving||dirty)return;
  try{
    const r=await rpc('nw28_load',{p_user:CRED.u,p_pass:CRED.p,p_have:paksa?null:VER});
    if(r.status!=='ok'){if(r.status==='bad')keluar('Sesi berakhir, silakan masuk lagi.');return}
    if(saving||dirty)return;
    if(r.version!==VER||paksa){if(r.data!==undefined)pakai(r.data);VER=r.version;setSync('Tersimpan');if(paksa||!sedangIsi())render();else UI.basi=true}
    else if(UI.basi&&!sedangIsi()){UI.basi=false;render()}
  }catch(e){}
}
setInterval(()=>{if(document.visibilityState==='visible')tarik(false)},20000);

}

function rekap(dari,sampai){
  const g={};
  for(const s of S.segs){if(s.tgl<dari||s.tgl>sampai)continue;(g[s.tgl+'|'+s.wid]=g[s.tgl+'|'+s.wid]||[]).push(s)}
  const out=[];
  for(const k in g){const [tgl,wid]=k.split('|');const w=W(+wid);if(w)out.push({tgl,w,h:hitung(w,g[k])})}
  return out.sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0);
}

  let ticks='';for(let m=T0;m<=t1;m+=120)ticks+=`<span class="${m===T0?'first':m===t1?'last':''}" style="left:${px(m)}%">${String(m>1440?m/60-24:m/60).padStart(2,'0')}${m>1440?'⁺':''}</span>`;
  const bloks=h.rows.map(x=>{const s=x.s,p=P(s.pid);if(ev)return `

function muatSkrip(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error(src));document.head.appendChild(s)})}
async function unduhPDF(ids){
  if(UI.pdf)return;
  const rows=dataGaji().filter(o=>ids.includes(o.w.id));
  if(!rows.length){toast('Centang dulu pekerja yang mau diunduh');return}
  UI.pdf=true;toast('Menyiapkan PDF…');
  let host;
  try{
    if(!window.html2canvas)await muatSkrip('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf)await muatSkrip('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    host=document.createElement('div');host.className='slip-host';document.body.appendChild(host);
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),PW=210,PH=297,M=8,w=PW-2*M;let first=true;
    for(const o of rows){
      host.innerHTML=slipHTML(o);
      const im=host.querySelector('img');if(im&&!im.complete)await new Promise(r=>{im.onload=im.onerror=r});
      const cv=await window.html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff'});
      const k=cv.width/w,pageH=Math.floor((PH-2*M)*k);
      for(let y=0;y<cv.height;y+=pageH){
        const hh=Math.min(pageH,cv.height-y),c=document.createElement('canvas');c.width=cv.width;c.height=hh;
        c.getContext('2d').drawImage(cv,0,y,cv.width,hh,0,0,cv.width,hh);
        if(!first)pdf.addPage();first=false;
        pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',M,M,w,hh/k);
      }
    }
    const slug=s=>s.trim().replace(/[^A-Za-z0-9]+/g,'-');
    pdf.save(`Slip-${rows.length===1?slug(rows[0].w.nama):rows.length+'-pekerja'}_${UI.dari}_${UI.sampai}.pdf`);
    toast(rows.length===1?'PDF slip diunduh':`PDF berisi ${rows.length} slip diunduh`);
  }catch(e){toast('PDF gagal dibuat. Periksa internet lalu coba lagi.')}
  if(host)host.remove();UI.pdf=false;
}

        <span class="bar"><i style="width:${o.bN/mx*100}%;background:${o.p.warna}"></i><i class="l" style="width:${o.bL/mx*100}%;background-color:${o.p.warna}"></i></span>
        <span class="small muted num">${num(o.hari)} hari-orang · ${rp(o.bN)} normal &nbsp;|&nbsp; ${num(o.lem/60)} jam lembur · ${rp(o.bL)}${o.kas?` &nbsp;|&nbsp; kasbon −${rp(o.kas)}`:''}</span>

  const master=S.projects.map(p=>`<div class="blok">

  return `${periodeBar('Biaya tenaga kerja per proyek')}

/* ---------- ATURAN ---------- */
function vAturan(){
  const card=tp=>{const r=S.rules[tp];if(r.mode==='argo')return `<section class="panel"><h3><span class="pill ev">Event</span></h3>
    <div class="field"><span>1 argo</span><b>24 jam sejak jam berangkat</b></div>

    <div class="field"><span>Lembur dan istirahat</span><span>tidak dihitung</span></div>
    <p class="small muted">Contoh: berangkat Senin 18:00, argo selesai Selasa 18:00. Kalau lanjut, tambah jumlah argo.</p></section>`;const d=`data-k="r" data-tipe="${tp}"`;return `<section class="panel">
    <h3><span class="pill ${PC[tp]}">${TIPE[tp]}</span></h3>
    <div class="field"><span>Jam kerja normal</span><span class="row"><select id="r${tp}m" ${d} data-f="mulai" aria-label="Mulai">${opsiJam(r.mulai)}</select>–<select id="r${tp}s" ${d} data-f="selesai" aria-label="Selesai">${opsiJam(r.selesai)}</select></span></div>
    ${r.ist.map((x,i)=>`<div class="field"><span>Istirahat ${i+1}</span><span class="row"><select id="r${tp}i${i}a" ${d} data-f="ist" data-i="${i}" data-j="0" aria-label="Mulai istirahat">${opsiJam(x[0])}</select>–<select id="r${tp}i${i}b" ${d} data-f="ist" data-i="${i}" data-j="1" aria-label="Selesai istirahat">${opsiJam(x[1])}</select></span></div>`).join('')}
    <div class="field"><label class="row" for="r${tp}d"><input type="checkbox" id="r${tp}d" ${d} data-f="dobel"${r.dobel?' checked':''}> Upah jadi 2× bila masuk di jam normal dan keluar jam</label><select id="r${tp}j" ${d} data-f="dobelJam" aria-label="Jam batas 2×">${opsiJam(r.dobelJam)}</select></div>
    ${r.dobel?`<div class="field"><span>Saat kena 2×, jam lembur malam itu</span><select id="r${tp}g" ${d} data-f="ganti" aria-label="Cara hitung 2×"><option value="1"${r.ganti?' selected':''}>diganti 1 hari upah (total 2 hari)</option><option value="0"${r.ganti?'':' selected'}>tetap dibayar + 1 hari upah</option></select></div>`:''}
    ${ed('r|'+tp)}
  </section>`};
  return `<div><div class="label">Pengaturan</div><h2 style="font-size:24px">Aturan jam dan lembur</h2></div>
  <div class="rules">${card('workshop')}${card('garut')}${card('event')}</div>
  <section class="panel explain">
    <h3>Cara aplikasi menghitung</h3>
    <ul>
      <li>Jam kerja normal dibagi jadi sesi oleh jam istirahat. Dengan 08:00–16:00 dan istirahat 12:00–13:00, ada dua sesi dan masing-masing bernilai <b>0,5 hari</b>.</li>
      <li>Kalau pekerja pindah proyek di tengah sesi, nilai sesi dibagi sesuai jamnya. Biaya normal = bobot hari × upah harian.</li>
      <li>Semua jam di luar jam normal adalah <b>lembur</b>, dipotong jam istirahat. Biaya lembur = jam lembur × tarif lembur per jam pekerja itu, dan masuk ke proyek yang dipilih di blok tersebut.</li>
      <li>Kerja lewat tengah malam diisi di tanggal mulainya: pilih jam selesai bertanda "(besok)", sampai 08:00. Semua jamnya dihitung sebagai lembur hari itu.</li>
      <li>Tarif lembur bisa diganti khusus untuk satu blok lewat kolom tarif yang muncul di blok lembur.</li>
      <li>Tim Garut memakai jam normal sendiri (07:00–17:00), setelah itu lembur dengan potongan istirahat 18:00–19:00.</li>
      <li>Event: upah dihitung per argo 24 jam sejak jam berangkat, masuk ke proyek yang dipilih dan dicatat di tanggal berangkat.</li>
      <li>Kasbon selalu memotong upah pekerja. Kalau kasbon diberi proyek, nilai proyek itu ikut berkurang di periode yang memuat tanggal kasbonnya.</li>
      <li>Tim Garut dapat 2× upah harian bila masuk 07:00 dan keluar 23:00. Kalau masuknya mundur, jam keluarnya wajib mundur sama banyak (masuk 08:00 berarti keluar 24:00). Kalau syarat itu tidak terpenuhi, lemburnya dihitung per jam biasa. Jam kerja setelah syarat terpenuhi dibayar lembur per jam, di atas 2× upah.</li>
    </ul>
  </section>
  <section class="panel kartu"><h3>Riwayat edit</h3>${S.log.length?`<div class="detail-list small">${S.log.slice(0,20).map(l=>`<div><b>${esc(l.by)}</b><span>${esc(l.apa)}</span><span class="muted num">${jamEdit(l.at)}</span></div>`).join('')}</div>`:'<span class="muted small">Belum ada perubahan.</span>'}</section>
  <section class="panel"><span class="small muted">Data tersimpan di server dan sama untuk semua pengguna. Perubahan orang lain muncul otomatis dalam beberapa detik.</span></section>`;
}

const VIEW={absensi:vAbsensi,gaji:vGaji,proyek:vProyek,pekerja:vPekerja,aturan:vAturan};
function render(){

  who.innerHTML=`<span id="sync">${esc(UI.sync)}</span><span>Masuk sebagai <b>${esc(UI.user)}</b></span><button data-act="keluar">Keluar</button>`;

function ubah(){simpan();render()}
const nid=()=>S.nid++;

function blokBaru(w,tgl){
  const r=S.rules[w.tipe],mine=S.segs.filter(s=>s.tgl===tgl&&s.wid===w.id&&s.b>s.a);
  const pid=mine.length?mine[mine.length-1].pid:(S.projects.find(p=>p.aktif)||{}).id;
  if(!pid){toast('Tambahkan proyek dulu di tab Proyek');return null}
  if(r.mode==='argo'){
    if(S.segs.some(s=>s.tgl===tgl&&s.wid===w.id)){toast('Sudah ada argo di hari ini. Tambah jumlah argo kalau lebih dari 24 jam.');return null}
    return {id:nid(),tgl,wid:w.id,pid,a:480,b:1440,hari:1,tarif:null};
  }
  const e=mine.reduce((m,s)=>Math.max(m,s.b),0);
  let a,b;
  const next=sesi(r).find(([p,q])=>q>e);
  if(!mine.length&&next){[a,b]=next}
  else if(next){a=Math.max(e,next[0]);b=next[1]}
  else{a=Math.max(e,r.selesai);b=a<1320?1320:Math.min(a+60,TMAX)}
  if(a>=TMAX){toast('Blok hari ini sudah penuh sampai 08:00 besok');return null}
  return {id:nid(),tgl,wid:w.id,pid,a,b,tarif:null};
}

document.addEventListener('click',e=>{
  if(e.target.closest('input,select,textarea'))return;
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=+t.dataset.id;
  switch(act){
    case 'pdf':unduhPDF([id]);return;
    case 'pdf-pilih':unduhPDF([...UI.slip]);return;
    case 'keluar':keluar();return;
    case 'tab':UI.tab=t.dataset.tab;UI.reset=false;UI.salin='';render();window.scrollTo(0,0);return;
    case 'tgl':UI.tgl=addD(UI.tgl,+t.dataset.n);UI.pilih.clear();render();return;
    case 'hari-ini':UI.tgl=HARI_INI;UI.pilih.clear();render();return;
    case 'buka':UI.buka.has(id)?UI.buka.delete(id):UI.buka.add(id);render();return;
    case 'buka-p':UI.bukaP.has(id)?UI.bukaP.delete(id):UI.bukaP.add(id);render();return;
    case 'add-seg':{const s=blokBaru(W(id),UI.tgl);if(s){S.segs.push(s);abs(id,UI.tgl)}break}
    case 'normal':{const w=W(id),pid=(S.projects.find(p=>p.aktif)||{}).id;if(!pid){toast('Tambahkan proyek dulu di tab Proyek');return}
      for(const [a,b] of sesi(S.rules[w.tipe]))S.segs.push({id:nid(),tgl:UI.tgl,wid:id,pid,a,b,tarif:null});abs(id,UI.tgl);break}
    case 'del-seg':{const s=S.segs.find(s=>s.id===id);if(s)abs(s.wid,s.tgl);S.segs=S.segs.filter(s=>s.id!==id);break}
    case 'bulk':{
      if(!UI.pilih.size){toast('Centang dulu pekerja yang mau diisi');return}
      if(UI.bulk.b<=UI.bulk.a){toast('Jam selesai harus setelah jam mulai');return}
      let ok=0,skip=0;
      for(const wid of UI.pilih){
        if(S.rules[W(wid).tipe].mode==='argo'){
          if(S.segs.some(s=>s.tgl===UI.tgl&&s.wid===wid)){skip++;continue}
          S.segs.push({id:nid(),tgl:UI.tgl,wid,pid:UI.bulk.pid,a:UI.bulk.a,b:1440,hari:1,tarif:null});abs(wid,UI.tgl);ok++;continue}
        if(S.segs.some(s=>s.tgl===UI.tgl&&s.wid===wid&&ov(s.a,s.b,UI.bulk.a,UI.bulk.b)>0)){skip++;continue}
        S.segs.push({id:nid(),tgl:UI.tgl,wid,pid:UI.bulk.pid,a:UI.bulk.a,b:UI.bulk.b,tarif:null});abs(wid,UI.tgl);ok++}
      toast(`${ok} blok ditambahkan${skip?`, ${skip} dilewati karena jamnya bentrok`:''}`);break}
    case 'salin-kemarin':{
      const prev=S.segs.filter(s=>s.tgl<UI.tgl).reduce((m,s)=>s.tgl>m?s.tgl:m,'');
      if(!prev){toast('Belum ada absensi di hari sebelumnya');return}
      const sudah=new Set(S.segs.filter(s=>s.tgl===UI.tgl).map(s=>s.wid));let n=0;
      for(const s of S.segs.filter(s=>s.tgl===prev)){const w=W(s.wid);if(!w||!w.aktif||sudah.has(s.wid))continue;S.segs.push({...s,id:nid(),tgl:UI.tgl});abs(s.wid,UI.tgl);n++}
      toast(n?`${n} blok disalin dari ${tglPendek(prev)}`:'Semua pekerja sudah terisi, tidak ada yang disalin');break}
    case 'kosongkan':S.segs=[];S.kasbon=[];S.contoh=false;catat('Menghapus absensi contoh');toast('Absensi contoh dihapus. Pekerja dan proyek masih ada, silakan diedit.');break;
    case 'add-kas':{
      const wid=+document.getElementById('kb-w').value,j=+document.getElementById('kb-j').value,tg=document.getElementById('kb-t').value;
      if(!wid||!tg||!(j>0)){toast('Isi pekerja, tanggal, dan jumlah kasbon');return}
      const kid=nid();stamp('k|'+kid,'Kasbon '+W(wid).nama);S.kasbon.push({id:kid,tgl:tg,wid,pid:+document.getElementById('kb-p').value||null,jumlah:j,ket:document.getElementById('kb-k').value.trim()});break}
    case 'del-kas':catat('Menghapus kasbon');S.kasbon=S.kasbon.filter(k=>k.id!==id);break;
    case 'salin-rekap':{
      const L=[['Pekerja','Tipe','Hari','Jam lembur','Upah normal','Upah lembur','Kasbon','Diterima'].join('\t')];
      for(const o of dataGaji())L.push([o.w.nama,TIPE[o.w.tipe],num(o.hari),num(o.lem/60),Math.round(o.bN),Math.round(o.bL),Math.round(o.kas),Math.round(o.bN+o.bL-o.kas)].join('\t'));
      const txt=`Rekap gaji ${UI.dari} s.d. ${UI.sampai}\n`+L.join('\n');
      const gagal=()=>{UI.salin=txt;render();const b=document.getElementById('salin-box');if(b){b.focus();b.select()}};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Rekap disalin'),gagal)}catch(err){gagal()}
      return}
    case 'add-proj':{
      const n=document.getElementById('np-n').value.trim();if(!n){toast('Isi nama proyek');return}
      const pid=nid();stamp('p|'+pid,'Proyek '+n);S.projects.push({id:pid,nama:n,warna:WARNA[S.projects.length%WARNA.length],aktif:true});break}
    case 'del-proj':
      if(S.segs.some(s=>s.pid===id)||S.kasbon.some(k=>k.pid===id)){toast('Proyek ini sudah punya absensi atau kasbon. Nonaktifkan saja supaya datanya aman.');return}
      catat('Menghapus proyek');S.projects=S.projects.filter(p=>p.id!==id);break;
    case 'add-w':{
      const n=document.getElementById('nw-n').value.trim(),u=+document.getElementById('nw-u').value,l=+document.getElementById('nw-l').value;
      if(!n||!(u>0)){toast('Isi nama dan upah harian');return}
      const wid=nid();stamp('w|'+wid,'Pekerja '+n);S.workers.push({id:wid,nama:n,tipe:document.getElementById('nw-t').value,upah:u,lembur:l>0?l:0,aktif:true});break}
    case 'del-w':
      if(S.segs.some(s=>s.wid===id)||S.kasbon.some(k=>k.wid===id)){toast('Pekerja ini sudah punya absensi. Nonaktifkan saja supaya datanya aman.');return}
      catat('Menghapus pekerja');S.workers=S.workers.filter(w=>w.id!==id);break;
    case 'reset':UI.reset=true;render();return;
    case 'reset-batal':UI.reset=false;render();return;
    case 'reset-ya':{const lg=S.log;S=seed();S.edit={};S.log=lg;catat('Memuat ulang data contoh')}UI.reset=false;UI.pilih.clear();toast('Data contoh dimuat ulang');break;
    default:return;
  }
  ubah();
});

document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.k;if(!k)return;
  const id=+t.dataset.id,f=t.dataset.f,v=t.type==='checkbox'?t.checked:t.value;
  if(k==='seg'){const s=S.segs.find(x=>x.id===id);if(!s)return;abs(s.wid,s.tgl);if(f==='tarif')s.tarif=v===''?null:Math.max(0,+v||0);else if(f==='hari')s.hari=Math.max(1,Math.round(+v)||1);else s[f]=+v}
  else if(k==='w'){const w=W(id);stamp('w|'+id,'Pekerja '+w.nama);if(f==='nama')w.nama=v.trim()||w.nama;else if(f==='tipe'||f==='aktif')w[f]=v;else w[f]=Math.max(0,+v||0)}
  else if(k==='p'){const p=P(id);stamp('p|'+id,'Proyek '+p.nama);if(f==='nama')p.nama=v.trim()||p.nama;else p[f]=v}
  else if(k==='r'){const r=S.rules[t.dataset.tipe];stamp('r|'+t.dataset.tipe,'Aturan '+TIPE[t.dataset.tipe]);
    if(f==='ist')r.ist[+t.dataset.i][+t.dataset.j]=+v;else if(f==='dobel')r.dobel=v;else if(f==='ganti')r.ganti=v==='1';else r[f]=+v;
    if(r.selesai<=r.mulai)toast('Jam selesai normal harus setelah jam mulai')}
  else if(k==='kas'){const x=S.kasbon.find(q=>q.id===id);if(!x)return;x.pid=+v||null;stamp('k|'+id,'Kasbon '+((W(x.wid)||{}).nama||''))}
  else if(k==='ui'){if(!v)return;UI[f]=v;if(f==='tgl')UI.pilih.clear();if(UI.dari>UI.sampai){if(f==='dari')UI.sampai=v;else UI.dari=v}render();return}
  else if(k==='slip'){v?UI.slip.add(id):UI.slip.delete(id);render();return}
  else if(k==='slip-semua'){UI.slip.clear();if(v)for(const o of dataGaji())UI.slip.add(o.w.id);render();return}
  else if(k==='pilih'){v?UI.pilih.add(id):UI.pilih.delete(id);render();return}
  else if(k==='semua'){UI.pilih.clear();if(v){const sh=S.segs.filter(s=>s.tgl===UI.tgl);for(const w of S.workers)if(w.aktif||sh.some(s=>s.wid===w.id))UI.pilih.add(w.id)}render();return}
  else if(k==='bulk'){UI.bulk[f]=+v;render();return}
  ubah();
});

document.addEventListener('submit',async e=>{
  e.preventDefault();if(e.target.id!=='login'||UI.sibuk)return;
  const u=document.getElementById('lg-u').value.trim().toLowerCase(),p=document.getElementById('lg-p').value;
  UI.loginU=u;UI.sibuk=true;UI.loginErr='';render();
  let st;try{st=await masuk(u,p)}catch(err){st='net'}
  UI.sibuk=false;
  UI.loginErr=st==='ok'?'':st==='locked'?'Terlalu banyak percobaan salah. Coba lagi nanti.':st==='net'?'Tidak bisa terhubung ke server. Periksa internet lalu coba lagi.':'Username atau password salah';
  render();
});
(async()=>{
  let c=null;try{c=JSON.parse(sessionStorage.getItem(KEY+'-cred')||'null')}catch(e){}
  if(c&&c.u&&c.p){UI.sibuk=true;UI.loginU=c.u;render();try{await masuk(c.u,c.p)}catch(e){UI.loginErr='Tidak bisa terhubung ke server. Periksa internet lalu coba lagi.'}UI.sibuk=false}
  render();
})();
</script>
